<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Special Wish💕</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #ff4d6d;
    --bg-start: #ffe4ec;
    --bg-end: #fff0f5;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background: linear-gradient(160deg, var(--bg-start), var(--bg-end));
    font-family: 'Poppins', sans-serif;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  .screen {
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 30px;
    width: 100%;
    max-width: 500px;
    z-index: 5;
  }
  .screen.active { display: flex; animation: fadeIn 0.8s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

  h1.script {
    font-family: 'Great Vibes', cursive;
    font-size: 3rem;
    color: var(--primary);
    margin-bottom: 15px;
  }
  p.message { font-size: 1.1rem; color: #7a2e42; line-height: 1.6; margin-bottom: 25px; }

  /* Envelope */
  .envelope {
    width: 220px;
    height: 150px;
    background: var(--primary);
    border-radius: 8px;
    position: relative;
    cursor: pointer;
    box-shadow: 0 10px 25px rgba(255,77,109,0.4);
    transition: transform 0.3s;
  }
  .envelope:hover { transform: scale(1.05); }
  .envelope::before {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 0; height: 0;
    border-left: 110px solid transparent;
    border-right: 110px solid transparent;
    border-top: 90px solid #ff8fa3;
  }
  .envelope-heart {
    position: absolute;
    bottom: 20px; left: 50%;
    transform: translateX(-50%);
    font-size: 1.8rem;
  }
  .tap-hint { margin-top: 20px; color: #b23a52; font-size: 0.9rem; }

  /* Buttons */
  .btn {
    padding: 14px 34px;
    border: none;
    border-radius: 50px;
    font-size: 1.1rem;
    font-weight: 600;
    cursor: pointer;
    margin: 10px;
    transition: all 0.25s ease;
  }
  .btn-yes {
    background: linear-gradient(135deg, #ff4d6d, #ff8fa3);
    color: white;
    box-shadow: 0 6px 18px rgba(255,77,109,0.5);
  }
  .btn-no {
    background: white;
    color: var(--primary);
    border: 2px solid var(--primary);
    position: relative;
    transition: transform 0.35s ease, opacity 0.5s ease, left 0.35s ease, top 0.35s ease;
  }
  .btn-row { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; position: relative; height: 100px; }

  .guilt-text { min-height: 24px; color: #b23a52; font-size: 0.95rem; margin-top: 10px; }

  /* Floating hearts */
  .heart {
    position: fixed;
    bottom: -50px;
    font-size: 1.5rem;
    color: var(--primary);
    opacity: 0.7;
    animation: floatUp linear infinite;
    z-index: 1;
    pointer-events: none;
  }
  @keyframes floatUp {
    to { transform: translateY(-110vh) rotate(360deg); opacity: 0; }
  }

  /* Sound toggle */
  .sound-toggle {
    position: fixed;
    top: 16px;
    right: 16px;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: white;
    border: 2px solid var(--primary);
    color: var(--primary);
    font-size: 1.1rem;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    z-index: 30;
    box-shadow: 0 4px 12px rgba(255,77,109,0.3);
  }

  /* Typewriter cursor */
  .typing-cursor::after {
    content: '|';
    display: inline-block;
    margin-left: 2px;
    color: var(--primary);
    animation: blink 0.8s step-start infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  /* Confetti */
  .confetti {
    position: fixed;
    top: -20px;
    width: 8px; height: 14px;
    z-index: 4;
    pointer-events: none;
    animation: confettiFall linear forwards;
  }
  @keyframes confettiFall {
    to { transform: translateY(110vh) rotate(720deg); opacity: 0.8; }
  }
</style>
</head>
<body>

<!-- ============================================ -->
<!-- 🎀 CONFIG BLOCK — edit these values per client -->
<!-- ============================================ -->
<script>
const CONFIG = {
  senderName: "Zeehan",
  recipientName: "Eme",

  birthdayHeading: "Happy Birthday to my prettiest girl, Eme! 🎂💖",
  birthdayMessage: "I hope your day is as beautiful as your smile and as special as you are to me❤️.You deserve all the happiness in the world💐💕❤️!",
  questionText: "Will you marry me,Eme?💍",
  yesButtonText: "Yes 💖",
  noButtonText: "No",

  noButtonBehavior: {
    dodgeOnHover: true,
    shrinkEachClick: true,
    growYesButton: true,
    teleportAfterAttempts: 3,
    disableAfterAttempts: 6,
    guiltMessages: [
      "Are you sure? 🥺",
      "Really? 😢",
      "Try again? 🙈",
      "Please? 🙏",
      "Pretty please? 🥹"
    ],
  },

  celebrationHeading: "Congratulations! 🎉",
  celebrationMessage: "my little baby❤️! You’ve become  my life story that I never want to end. 📖✨Not because something special always happens when you’re around, but because even the simplest moments feel special with you❤️.Your smile, your voice, your little moments with me they’re the memories I’d replay a thousand times🎞️❤️",
  confettiColors: ["#ff4d6d", "#ff8fa3", "#ffffff", "#ffb3c6"],
};
</script>

<!-- Sound on/off toggle -->
<button class="sound-toggle" id="soundToggle" title="Sound on/off">🔊</button>

<!-- Floating hearts background -->
<div id="heartsBg"></div>

<!-- Screen 1: Envelope -->
<div class="screen active" id="screen1">
  <div class="envelope" id="envelope">
    <span class="envelope-heart">💌</span>
  </div>
  <p class="tap-hint">A little gift for Eme!🎁💗✨</p>
</div>

<!-- Screen 2: Birthday -->
<div class="screen" id="screen2">
  <h1 class="script" id="birthdayHeading"></h1>
  <p class="message" id="birthdayMessage"></p>
  <button class="btn btn-yes" id="nextBtn" onclick="handleNextClick()" style="opacity:0;pointer-events:none;transition:opacity 0.5s ease;">Next 💕</button>
</div>

<!-- Screen 3: The Question -->
<div class="screen" id="screen3">
  <h1 class="script" id="questionText"></h1>
  <div class="btn-row">
    <button class="btn btn-yes" id="yesBtn" onclick="handleYesClick()"></button>
    <button class="btn btn-no" id="noBtn"></button>
  </div>
  <p class="guilt-text" id="guiltText"></p>
</div>

<!-- Screen 4: Celebration -->
<div class="screen" id="screen4">
  <h1 class="script" id="celebrationHeading"></h1>
  <p class="message" id="celebrationMessage"></p>
  <div style="font-size:2.5rem;">💖🎉💍🎉💖</div>
</div>

<script>
  // ============================================
  // 🔊 SOUND EFFECTS ENGINE (Web Audio API)
  // Kono external mp3/sound file lage na — sob
  // sound live "synthesize" kora hocche, tai
  // offline-eo kaj korbe.
  // ============================================
  let audioCtx = null;
  let soundOn = true;

  function getAudioCtx() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }

  function playTone(freq, duration, type, startTime, volume) {
    if (!soundOn) return;
    const ctx = getAudioCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type || 'sine';
    osc.frequency.value = freq;
    const t0 = ctx.currentTime + (startTime || 0);
    gain.gain.setValueAtTime(0, t0);
    gain.gain.linearRampToValueAtTime(volume || 0.2, t0 + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.001, t0 + duration);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(t0);
    osc.stop(t0 + duration + 0.05);
  }

  // Envelope / letter opening — realistic paper crinkle
  // (layered short bursts of filtered noise at random pitches,
  // mimicking the irregular crackle of real paper being unfolded)
  function playPaperSound() {
    if (!soundOn) return;
    const ctx = getAudioCtx();

    function noiseBurst(startTime, len, freq, q, vol) {
      const bufferSize = Math.max(1, Math.floor(ctx.sampleRate * len));
      const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        // slightly biased noise so it "crackles" instead of hissing smoothly
        const n = Math.random() * 2 - 1;
        data[i] = n * Math.pow(1 - i / bufferSize, 1.5);
      }
      const src = ctx.createBufferSource();
      src.buffer = buffer;
      const filter = ctx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.value = freq;
      filter.Q.value = q;
      const gain = ctx.createGain();
      const t0 = ctx.currentTime + startTime;
      gain.gain.setValueAtTime(vol, t0);
      gain.gain.exponentialRampToValueAtTime(0.001, t0 + len);
      src.connect(filter);
      filter.connect(gain);
      gain.connect(ctx.destination);
      src.start(t0);
    }

    // A handful of overlapping crinkle bursts, randomized timing/pitch/length
    // so each envelope-open sounds slightly different, like real paper.
    let t = 0;
    const crinkles = 9 + Math.floor(Math.random() * 4); // 9-12 crackles
    for (let i = 0; i < crinkles; i++) {
      const len = 0.03 + Math.random() * 0.07;
      const freq = 1500 + Math.random() * 3500; // scratchy high-frequency texture
      const q = 0.5 + Math.random() * 1.5;
      const vol = 0.15 + Math.random() * 0.15;
      noiseBurst(t, len, freq, q, vol);
      t += 0.025 + Math.random() * 0.05;
    }
    // one final broader "unfold" swish under the crackles
    noiseBurst(0, t + 0.15, 900, 0.5, 0.12);
  }

  // Screen 2 (birthday reveal) — soft romantic bell
  function playRevealChime() {
    playTone(523.25, 0.5, 'sine', 0.00, 0.20);   // C5
    playTone(659.25, 0.5, 'sine', 0.10, 0.18);   // E5
    playTone(783.99, 0.6, 'sine', 0.20, 0.16);   // G5
  }

  // "Next" button — gentle soft pop, leading into screen 3
  function playNextSound() {
    playTone(700, 0.15, 'sine', 0.00, 0.18);
    playTone(950, 0.18, 'sine', 0.05, 0.14);
  }

  // Screen 3 (the question) — light suspenseful shimmer
  function playQuestionChime() {
    playTone(880, 0.35, 'sine', 0.00, 0.15);
    playTone(1046.5, 0.4, 'sine', 0.12, 0.13);
  }

  // "Yes" button click — bright, distinct click sound
  function playYesClickSound() {
    playTone(1200, 0.08, 'square', 0.00, 0.12);
    playTone(1500, 0.06, 'sine', 0.02, 0.10);
  }

  // Celebration screen — happy ascending fanfare
  function playCelebrationSound() {
    const notes = [523.25, 659.25, 783.99, 1046.5, 1318.5]; // C5 E5 G5 C6 E6
    notes.forEach((f, i) => playTone(f, 0.5, 'triangle', i * 0.11, 0.22));
  }

  // Typewriter word-tick — realistic mechanical keyboard click.
  // Real key sounds are actually TWO layered parts:
  //  1) a very short, high-pitched "click" (the switch snapping)
  //  2) a slightly lower, slightly-delayed "thock" (the case/plate resonating)
  // Layering both + randomizing pitch/timing a little per press is what
  // makes it sound mechanical instead of like a synth beep.
  function playKeyClickSound() {
    if (!soundOn) return;
    const ctx = getAudioCtx();

    function noiseBurst(startTime, len, freqLow, freqHigh, q, vol, filterType) {
      const bufferSize = Math.max(1, Math.floor(ctx.sampleRate * len));
      const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bufferSize, 2.2);
      }
      const src = ctx.createBufferSource();
      src.buffer = buffer;

      const filter = ctx.createBiquadFilter();
      filter.type = filterType || 'bandpass';
      filter.frequency.value = freqLow + Math.random() * (freqHigh - freqLow);
      filter.Q.value = q;

      const gain = ctx.createGain();
      const t0 = ctx.currentTime + startTime;
      gain.gain.setValueAtTime(vol, t0);
      gain.gain.exponentialRampToValueAtTime(0.001, t0 + len);

      src.connect(filter);
      filter.connect(gain);
      gain.connect(ctx.destination);
      src.start(t0);
    }

    // Slight randomization so not every key sounds identical (realism)
    const jitter = () => (Math.random() - 0.5) * 0.004;

    // 1) The "click" — sharp, short, high-frequency snap
    noiseBurst(0 + jitter(), 0.012, 3200, 5500, 2.2, 0.16, 'highpass');

    // 2) The "thock" — lower body resonance, arrives a few ms after the click
    noiseBurst(0.006 + jitter(), 0.045, 140, 260, 3.5, 0.11, 'bandpass');

    // 3) A tiny mid-frequency tap for extra "plastic" texture
    noiseBurst(0.003 + jitter(), 0.02, 900, 1400, 1.5, 0.05, 'bandpass');
  }

  // "No" button dodge — cute playful boop, each time it runs away
  function playDodgeSound() {
    if (!soundOn) return;
    const ctx = getAudioCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(520, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(210, ctx.currentTime + 0.18);
    gain.gain.setValueAtTime(0.16, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.18);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.2);
  }

  // ---------- Populate content from CONFIG ----------
  // birthdayHeading / birthdayMessage / celebrationHeading / celebrationMessage
  // are intentionally left empty here — they get typed word-by-word
  // (see "Word-by-word typewriter effect" below) instead of appearing instantly.
  document.getElementById('questionText').textContent = CONFIG.questionText;
  document.getElementById('yesBtn').textContent = CONFIG.yesButtonText;
  document.getElementById('noBtn').textContent = CONFIG.noButtonText;

  // ============================================
  // ⌨️ Word-by-word typewriter effect
  // Wish message gula (birthday + celebration) ekta
  // ekta word kore type hoye ashbe. Shesh hole
  // callback call hoy (jemon: Next button dekhano).
  // ============================================
  const TYPE_WORD_SPEED = 220; // ms — kotota fast/slow word ashbe, change korte paro

  function typeWords(el, text, speed, onDone) {
    el.classList.add('typing-cursor');
    el.textContent = '';
    const words = text.split(' ');
    let i = 0;
    function step() {
      if (i < words.length) {
        el.textContent += (i === 0 ? '' : ' ') + words[i];
        playKeyClickSound();
        i++;
        setTimeout(step, speed);
      } else {
        el.classList.remove('typing-cursor');
        if (onDone) onDone();
      }
    }
    step();
  }

  // Types heading, then message, then runs onAllDone (e.g. reveal Next button)
  function typeWishScreen(headingEl, headingText, messageEl, messageText, onAllDone) {
    typeWords(headingEl, headingText, TYPE_WORD_SPEED, () => {
      setTimeout(() => {
        typeWords(messageEl, messageText, TYPE_WORD_SPEED, onAllDone);
      }, 250);
    });
  }

  let screen2Typed = false;
  let screen4Typed = false;

  function playScreen2Typing() {
    if (screen2Typed) return;
    screen2Typed = true;
    const heading = document.getElementById('birthdayHeading');
    const message = document.getElementById('birthdayMessage');
    const nextBtn = document.getElementById('nextBtn');
    typeWishScreen(heading, CONFIG.birthdayHeading, message, CONFIG.birthdayMessage, () => {
      nextBtn.style.opacity = '1';
      nextBtn.style.pointerEvents = 'auto';
    });
  }

  function playScreen4Typing() {
    if (screen4Typed) return;
    screen4Typed = true;
    const heading = document.getElementById('celebrationHeading');
    const message = document.getElementById('celebrationMessage');
    typeWishScreen(heading, CONFIG.celebrationHeading, message, CONFIG.celebrationMessage);
  }

  // ---------- Screen navigation ----------
  function goTo(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    if (id === 'screen2') { launchConfetti(); playRevealChime(); playScreen2Typing(); }
    if (id === 'screen3') { playQuestionChime(); }
    if (id === 'screen4') { launchConfetti(); playCelebrationSound(); playScreen4Typing(); }
  }

  // ---------- Sound on/off toggle ----------
  const soundToggleBtn = document.getElementById('soundToggle');
  soundToggleBtn.addEventListener('click', () => {
    soundOn = !soundOn;
    soundToggleBtn.textContent = soundOn ? '🔊' : '🔇';
    if (soundOn) getAudioCtx(); // unlock/resume audio on this tap
  });

  document.getElementById('envelope').addEventListener('click', () => {
    playPaperSound();          // 💌 letter/envelope opening sound
    setTimeout(() => goTo('screen2'), 150); // let the paper sound start before the screen change
  });

  // "Next" (birthday -> question) — soft pop sound, then transition
  function handleNextClick() {
    playNextSound();
    setTimeout(() => goTo('screen3'), 120);
  }

  // "Yes" button — distinct click sound, then celebration
  function handleYesClick() {
    playYesClickSound();
    setTimeout(() => goTo('screen4'), 150);
  }

  // ---------- Floating hearts background ----------
  function startFloatingHearts() {
    setInterval(() => {
      const heart = document.createElement('div');
      heart.className = 'heart';
      heart.textContent = ['💕','💖','💗','❤️'][Math.floor(Math.random()*4)];
      heart.style.left = Math.random() * 100 + 'vw';
      heart.style.fontSize = (1 + Math.random()*1.5) + 'rem';
      const duration = 6 + Math.random() * 6;
      heart.style.animationDuration = duration + 's';
      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), duration * 1000);
    }, 600);
  }
  startFloatingHearts();

  // ---------- Confetti burst ----------
  function launchConfetti() {
    for (let i = 0; i < 60; i++) {
      const c = document.createElement('div');
      c.className = 'confetti';
      c.style.left = Math.random() * 100 + 'vw';
      c.style.background = CONFIG.confettiColors[Math.floor(Math.random()*CONFIG.confettiColors.length)];
      c.style.animationDuration = (2 + Math.random()*2) + 's';
      document.body.appendChild(c);
      setTimeout(() => c.remove(), 4500);
    }
  }

  // ---------- "No" button dodge/shrink logic ----------
  const noBtn = document.getElementById('noBtn');
  const yesBtn = document.getElementById('yesBtn');
  const guiltText = document.getElementById('guiltText');
  const behavior = CONFIG.noButtonBehavior;
  let noAttempts = 0;
  let yesScale = 1;
  let noScale = 1;

  // Move the "No" button to a random spot anywhere in the viewport,
  // always kept far from the "Yes" button so an accidental tap
  // near where "No" used to be won't land on "Yes".
  function moveNoButtonRandom() {
    const btnWidth = noBtn.offsetWidth || 90;
    const btnHeight = noBtn.offsetHeight || 50;
    const margin = 20;
    const safeRadius = 140; // minimum distance to keep from Yes button (px)
    const yesRect = yesBtn.getBoundingClientRect();

    let x, y, tries = 0;
    do {
      x = margin + Math.random() * Math.max(0, window.innerWidth - btnWidth - margin * 2);
      y = margin + Math.random() * Math.max(0, window.innerHeight - btnHeight - margin * 2);
      const dx = (x + btnWidth / 2) - (yesRect.left + yesRect.width / 2);
      const dy = (y + btnHeight / 2) - (yesRect.top + yesRect.height / 2);
      const dist = Math.sqrt(dx * dx + dy * dy);
      tries++;
      if (dist >= safeRadius || tries > 20) break;
    } while (true);

    noBtn.style.position = 'fixed';
    noBtn.style.left = x + 'px';
    noBtn.style.top = y + 'px';
    noBtn.style.zIndex = '20';
  }

  function handleNoInteraction() {
    // unused — kept as a no-op in case anything still references it
  }

  // Auto-move the "No" button on a timer — works with or without
  // a cursor, so it behaves the same on mobile (tap) and desktop.
  const maxMoves = 4; // koybar move korbe, tarpor vanish
  let moveCount = 0;

  function autoMoveNoButton() {
    moveCount++;

    if (moveCount > maxMoves) {
      // vanish for good
      noBtn.style.opacity = '0';
      noBtn.style.pointerEvents = 'none';
      setTimeout(() => { noBtn.style.display = 'none'; }, 400);
      guiltText.textContent = "😄";
      return;
    }

    moveNoButtonRandom();
    playDodgeSound();

    // fade + shrink a bit each move so it visibly gets weaker
    const scale = Math.max(1 - moveCount * 0.15, 0.3);
    const opacity = Math.max(1 - moveCount * 0.15, 0.3);
    noBtn.style.transform = `scale(${scale})`;
    noBtn.style.opacity = opacity;

    if (behavior.guiltMessages && behavior.guiltMessages.length) {
      const idx = Math.min(moveCount - 1, behavior.guiltMessages.length - 1);
      guiltText.textContent = behavior.guiltMessages[idx];
    }
    if (behavior.growYesButton) {
      yesScale = Math.min(1 + moveCount * 0.12, 1.8);
      yesBtn.style.transform = `scale(${yesScale})`;
    }

    // schedule next move (2 seconds later)
    setTimeout(autoMoveNoButton, 2000);
  }

  // Start the sequence once Screen 3 becomes visible
  const screen3 = document.getElementById('screen3');
  let autoMoveStarted = false;
  const screen3Observer = new MutationObserver(() => {
    if (screen3.classList.contains('active') && !autoMoveStarted) {
      autoMoveStarted = true;
      setTimeout(autoMoveNoButton, 1500); // small delay before first move
    }
  });
  screen3Observer.observe(screen3, { attributes: true, attributeFilter: ['class'] });

  // If the recipient still manages to tap "No" before it vanishes,
  // just treat it the same as a move (doesn't count as a real "no")
  noBtn.addEventListener('click', (e) => {
    e.preventDefault();
  });
</script>

</body>
</html>
